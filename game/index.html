<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1d2b44">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Jet Skirmish</title>
  <link rel="stylesheet" href="style.css">
  <script src="vendor/peerjs.min.js"></script>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="menu" class="panel">
    <h1>Jet Skirmish</h1>
    <p class="sub">Jetpack shooter · placeholder art build</p>
    <label>Your name <input id="name" maxlength="14" placeholder="Player"></label>

    <fieldset>
      <legend>Match settings (offline / hosting)</legend>
      <label>Map <select id="map"></select></label>
      <label>Mode
        <select id="mode"><option value="ffa">Free for all</option><option value="tdm">Team deathmatch</option></select>
      </label>
      <label>Kill limit <input id="kills" type="number" min="1" max="100" value="20"></label>
      <label>Bots <input id="bots" type="number" min="0" max="7" value="3"></label>
      <label class="check"><input id="ammo" type="checkbox" checked> Unlimited ammo</label>
      <label class="check"><input id="fuel" type="checkbox" checked> Unlimited jetpack</label>
    </fieldset>

    <div class="buttons">
      <button id="playBots">Play vs bots</button>
      <button id="host">Host online room</button>
    </div>
    <div class="join">
      <input id="code" maxlength="6" placeholder="ROOM CODE" autocapitalize="characters">
      <button id="join">Join</button>
    </div>
    <p id="status"></p>
    <p class="help">Keyboard: A/D move · W or Space fly · mouse aim/shoot · R reload · Q swap · E pick up · G or right-click grenade · F melee · Tab scores</p>
  </div>

  <div id="ingame" hidden>
    <button id="menuBtn" aria-label="Menu">≡</button>
    <div id="pause" class="panel small" hidden>
      <p id="roomInfo"></p>
      <button id="invite">Invite friends</button>
      <button id="leave">Leave match</button>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
